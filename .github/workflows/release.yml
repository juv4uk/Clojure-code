name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: linux
          - runner: ubuntu-24.04-arm
            os-name: linux-arm64
          - runner: macos-latest
            os-name: macos
          - runner: macos-13
            os-name: macos-intel
          - runner: windows-latest
            os-name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.2.1446

      - name: Build Uberjar (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          clojure -M:prod uberjar ${{ matrix.os-name }}
          mv target/clojure-code-*-standalone.jar target/clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.jar

      - name: Build Uberjar (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          clojure -M:prod uberjar ${{ matrix.os-name }}
          Move-Item target/clojure-code-*-standalone.jar target/clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.jar

      - name: Create Executable with jpackage (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          jpackage --type app-image --name Clojure-code-${{ github.ref_name }} --input target/ --main-jar clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.jar --main-class nightcode.start

      - name: Create Executable with jpackage (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          jpackage --type app-image --name Clojure-code-${{ github.ref_name }} --input target/ --main-jar clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.jar --main-class nightcode.start

      - name: Archive Executable (Windows)
        if: matrix.runner == 'windows-latest'
        shell: powershell
        run: Compress-Archive -Path Clojure-code-${{ github.ref_name }} -DestinationPath Clojure-code-windows-${{ github.ref_name }}.zip

      - name: Archive Executable (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          # jpackage wraps app-image output in a .app bundle on macOS,
          # but produces a plain directory on Linux.
          if [[ "${{ matrix.os-name }}" == macos* ]]; then
            src="Clojure-code-${{ github.ref_name }}.app"
          else
            src="Clojure-code-${{ github.ref_name }}"
          fi
          tar -czf Clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.tar.gz "$src"

      - name: Upload Uberjar to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os-name }}
          path: target/clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.jar
          retention-days: 1

      - name: Upload Executable to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os-name }}
          path: Clojure-code-${{ matrix.os-name }}-${{ github.ref_name }}.*
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
