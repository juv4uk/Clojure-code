name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: linux
            archive-cmd: tar -czf Clojure-code-linux.tar.gz Clojure-code
            artifact-name: Clojure-code-linux.tar.gz
          - runner: macos-latest
            os-name: macos
            archive-cmd: tar -czf Clojure-code-macos.tar.gz Clojure-code
            artifact-name: Clojure-code-macos.tar.gz
          - runner: windows-latest
            os-name: windows
            archive-cmd: Compress-Archive -Path Clojure-code -DestinationPath Clojure-code-windows.zip
            artifact-name: Clojure-code-windows.zip
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.2.1446

      - name: Build Uberjar
        shell: bash
        run: |
          clojure -M:prod uberjar ${{ matrix.os-name }}
          mv target/clojure-code-*-standalone.jar target/clojure-code-${{ matrix.os-name }}.jar

      - name: Create Executable with jpackage
        shell: bash
        run: |
          jpackage --type app-image --name Clojure-code --input target/ --main-jar clojure-code-${{ matrix.os-name }}.jar --main-class nightcode.start

      - name: Archive Executable (Windows)
        if: matrix.runner == 'windows-latest'
        shell: powershell
        run: ${{ matrix.archive-cmd }}

      - name: Archive Executable (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: ${{ matrix.archive-cmd }}

      - name: Upload Uberjar to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os-name }}
          path: target/clojure-code-${{ matrix.os-name }}.jar
          retention-days: 1

      - name: Upload Executable to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os-name }}
          path: ${{ matrix.artifact-name }}
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
