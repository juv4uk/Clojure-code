name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: linux
            archive-cmd: tar -czf Clojure-code-linux.tar.gz Clojure-code
            artifact-name: Clojure-code-linux.tar.gz
          - runner: macos-latest
            os-name: macos
            archive-cmd: ditto -c -k --sequesterRsrc --keepParent Clojure-code.app Clojure-code-macos.zip
            artifact-name: Clojure-code-macos.zip
          - runner: windows-latest
            os-name: windows
            archive-cmd: Compress-Archive -Path Clojure-code -DestinationPath Clojure-code-windows.zip
            artifact-name: Clojure-code-windows.zip
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.2.1446

      - name: Build Uberjar
        shell: bash
        run: |
          clojure -M:prod uberjar ${{ matrix.os-name }}
          mv target/clojure-code-*-standalone.jar target/clojure-code-${{ matrix.os-name }}.jar

      - name: Create Executable with jpackage
        shell: bash
        run: |
          jpackage --type app-image --name Clojure-code --input target/ --main-jar clojure-code-${{ matrix.os-name }}.jar --main-class nightcode.start

      - name: Archive Executable (Windows)
        if: matrix.runner == 'windows-latest'
        shell: powershell
        run: ${{ matrix.archive-cmd }}

      - name: Archive Executable (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: ${{ matrix.archive-cmd }}

      - name: Upload Uberjar to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/clojure-code-${{ matrix.os-name }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Executable to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
