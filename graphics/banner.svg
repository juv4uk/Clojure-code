<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5881D8" />
      <stop offset="50%" stop-color="#809CE3" />
      <stop offset="100%" stop-color="#91B612" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12" ry="12"/>
  
  <!-- Animated background circles for tech/IDE feel -->
  <g opacity="0.15">
    <circle cx="150" cy="100" r="50" fill="#5881D8">
      <animate attributeName="r" values="50;70;50" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="100" r="60" fill="#91B612">
      <animate attributeName="r" values="60;40;60" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Clojure Parentheses Animation -->
  <g transform="translate(180, 100)" fill="none" stroke="#5881D8" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <path d="M 20 -45 C -15 -45, -45 -15, -45 0 C -45 15, -15 45, 20 45">
      <animateTransform attributeName="transform" type="rotate" values="0; 10; 0; -10; 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(620, 100)" fill="none" stroke="#91B612" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <path d="M -20 -45 C 15 -45, 45 -15, 45 0 C 45 15, 15 45, -20 45">
      <animateTransform attributeName="transform" type="rotate" values="0; -10; 0; 10; 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main Title with floating animation -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" repeatCount="indefinite"/>
    <text x="400" y="115" font-family="'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">
      Clojure-code
    </text>
  </g>
  
  <!-- Subtitle with pulsating opacity -->
  <text x="400" y="155" font-family="'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">
    A modernized IDE for Clojure &amp; ClojureScript
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
